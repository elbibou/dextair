name: Update Dextair simulation site

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-sim-site.yml'

permissions:
  contents: write

jobs:
  update-site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Advance Dextair site to September 2037
        run: |
          python - <<'PY'
          from pathlib import Path

          for name in ['index.html','site-original.html']:
              p = Path(name)
              s = p.read_text()
              s = s.replace("const SIM_TODAY = new Date('2037-08-31T12:00:00');", "const SIM_TODAY = new Date('2037-09-30T12:00:00');", 1)
              s = s.replace('As of August 2037, Dextair operates 94 revenue-active aircraft. All six A321ceos are in service, adding 200-seat capacity on the busiest routes.', 'As of September 2037, Dextair operates 94 revenue-active aircraft. All six A321ceos are in service, adding 200-seat capacity on the busiest routes.', 1)
              s = s.replace("LFT:['Embraer E190']", "LFT:['Embraer E175']", 1)
              p.write_text(s)
          PY
      - name: Commit September website update
        run: |
          git config user.name "Dextair Site Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html site-original.html
          git diff --cached --quiet || git commit -m "Advance Dextair website to September 2037"
          git push
