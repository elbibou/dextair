name: Update Dextair simulation site

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-sim-site.yml'

permissions:
  contents: write

jobs:
  update-site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add fleet growth announcement
        run: |
          python - <<'PY'
          from pathlib import Path

          old = 'As of March 2038, Dextair operates 94 revenue-active aircraft.'
          new = 'As of March 2038, Dextair operates 94 revenue-active aircraft. Eight Airbus A321neos are now on firm order for deliveries beginning in late 2039, and two additional used Airbus A320neos have been acquired for induction into service in spring 2038.'

          for name in ['index.html','site-original.html']:
              p = Path(name)
              s = p.read_text()
              if old in s:
                  s = s.replace(old, new, 1)
              elif new not in s:
                  raise SystemExit(f'fleet summary marker missing in {name}')
              p.write_text(s)
          PY
      - name: Commit fleet growth update
        run: |
          git config user.name "Dextair Site Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html site-original.html
          git diff --cached --quiet || git commit -m "Add A321neo order and used A320neo acquisitions"
          git push
