name: Update Dextair simulation site

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-sim-site.yml'

permissions:
  contents: write

jobs:
  update-site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add Calgary service
        run: |
          python - <<'PY'
          from pathlib import Path

          airport_entry = ', {"code": "YYC", "city": "Calgary", "country": "Canada", "type": "international"}'
          freq_entry = ', "YYC": 4'
          plan_entry = "\n  YYC:['Airbus A321ceo','Airbus A321ceo','Airbus A321ceo','Airbus A321ceo']\n"

          for name in ['index.html','site-original.html']:
              p=Path(name)
              s=p.read_text()

              if '"code": "YYC"' not in s:
                  marker = '];\nconst airportMap = Object.fromEntries(airports.map(a => [a.code, a]));'
                  if marker not in s:
                      raise SystemExit(f'airport marker missing in {name}')
                  s=s.replace(marker, airport_entry + marker, 1)

              if '"YYC": 4' not in s:
                  marker = '};\nconst SIM_START = new Date('
                  if marker not in s:
                      raise SystemExit(f'frequency marker missing in {name}')
                  s=s.replace(marker, freq_entry + marker, 1)

              start=s.index('const aircraftPlans = {')
              end=s.index('\n};', start)
              if 'YYC:[' not in s[start:end]:
                  head=s[:end]
                  sep='' if head.rstrip().endswith(',') else ','
                  s=head + sep + plan_entry + s[end:]

              s=s.replace("['LAX','SFO','SEA','PDX','SAN','YVR']", "['LAX','SFO','SEA','PDX','SAN','YVR','YYC']", 1)
              s=s.replace("const mountain=new Set(['DEN','SLC','ABQ']);", "const mountain=new Set(['DEN','SLC','ABQ','YYC']);", 1)

              gate = "  const m=date.getMonth()+1, day=date.getDate();\n"
              launch = "  const m=date.getMonth()+1, day=date.getDate();\n  if(code==='YYC' && date < new Date('2038-02-01T12:00:00')) return 0;\n"
              if "code==='YYC' && date < new Date('2038-02-01T12:00:00')" not in s:
                  if gate not in s:
                      raise SystemExit(f'weekly frequency marker missing in {name}')
                  s=s.replace(gate, launch, 1)

              p.write_text(s)
          PY
      - name: Commit Calgary route
        run: |
          git config user.name "Dextair Site Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html site-original.html
          git diff --cached --quiet || git commit -m "Launch FLL YYC four times weekly with A321"
          git push
