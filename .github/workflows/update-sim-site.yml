name: Update Dextair simulation site

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-sim-site.yml'

permissions:
  contents: write

jobs:
  update-site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add used 737-800 acquisitions
        run: |
          python - <<'PY'
          from pathlib import Path

          old = 'As of March 2038, Dextair operates 94 revenue-active aircraft. Eight Airbus A321neos are now on firm order for deliveries beginning in late 2039, and two additional used Airbus A320neos have been acquired for induction into service in spring 2038.'
          new = 'As of March 2038, Dextair operates 94 revenue-active aircraft. Eight Airbus A321neos are now on firm order for deliveries beginning in late 2039, two additional used Airbus A320neos have been acquired for induction into service in spring 2038, and two used Boeing 737-800s have now been purchased for induction on lower-demand mainline flying.'

          for name in ['index.html','site-original.html']:
              p = Path(name)
              s = p.read_text()
              if old in s:
                  s = s.replace(old, new, 1)
              elif new not in s:
                  raise SystemExit(f'fleet summary marker missing in {name}')
              p.write_text(s)
          PY
      - name: Commit 737-800 acquisitions
        run: |
          git config user.name "Dextair Site Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html site-original.html
          git diff --cached --quiet || git commit -m "Add two used 737-800 acquisitions"
          git push
