name: Update Dextair simulation site

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-sim-site.yml'

permissions:
  contents: write

jobs:
  update-site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assign E175 to Lafayette Shuttle
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('site-original.html')
          s = p.read_text()
          old = "LFT:['Embraer E190']"
          new = "LFT:['Embraer E175']"
          if old not in s:
              raise SystemExit('LFT E190 assignment not found')
          s = s.replace(old, new, 1)
          p.write_text(s)

          idx = Path('index.html')
          x = idx.read_text()
          x = re.sub(r'/site-original\\.html(?:\\?v=[^\"\']*)?', '/site-original.html?v=20370701-lft175', x)
          idx.write_text(x)
          PY
      - name: Commit website update
        run: |
          git config user.name "Dextair Site Bot"
          git config user.email "actions@users.noreply.github.com"
          git add site-original.html index.html
          git diff --cached --quiet || git commit -m "Use E175 on Lafayette Shuttle"
          git push
