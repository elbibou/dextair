name: Update Dextair simulation site

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-sim-site.yml'

permissions:
  contents: write

jobs:
  update-site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Advance Dextair site to August 2037
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('site-original.html')
          s = p.read_text()
          s = s.replace("const SIM_TODAY = new Date('2037-06-30T12:00:00');", "const SIM_TODAY = new Date('2037-08-31T12:00:00');", 1)
          s = s.replace("const SIM_TODAY = new Date('2037-05-31T12:00:00');", "const SIM_TODAY = new Date('2037-08-31T12:00:00');", 1)
          s = s.replace('As of June 2037, Dextair operates 94 revenue-active aircraft. All six A321ceos are now in service, adding 200-seat capacity on the busiest routes.', 'As of August 2037, Dextair operates 94 revenue-active aircraft. All six A321ceos are in service, adding 200-seat capacity on the busiest routes.', 1)
          s = s.replace("LFT:['Embraer E190']", "LFT:['Embraer E175']", 1)
          p.write_text(s)

          idx = Path('index.html')
          x = idx.read_text()
          x = re.sub(r'/site-original\.html(?:\?v=[^"\']*)?', '/site-original.html?v=20370831', x)
          idx.write_text(x)
          PY
      - name: Commit website update
        run: |
          git config user.name "Dextair Site Bot"
          git config user.email "actions@users.noreply.github.com"
          git add site-original.html index.html
          git diff --cached --quiet || git commit -m "Advance Dextair website to August 2037"
          git push
