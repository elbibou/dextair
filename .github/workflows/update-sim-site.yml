name: Update Dextair simulation site

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-sim-site.yml'

permissions:
  contents: write

jobs:
  update-site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refresh connection booking scripts
        run: |
          python - <<'PY'
          from pathlib import Path
          for name in ['index.html','site-original.html']:
              p=Path(name)
              s=p.read_text()
              s=s.replace('/partner-routing.js?v=20260908-1','/partner-routing.js?v=20260908-2')
              s=s.replace('/booking-checkin.js?v=20260908-1','/booking-checkin.js?v=20260908-2')
              p.write_text(s)
          PY
      - name: Commit cache refresh
        run: |
          git config user.name "Dextair Site Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html site-original.html
          git diff --cached --quiet || git commit -m "Refresh connection booking scripts"
          git push
