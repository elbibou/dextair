name: Update Dextair simulation site

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-sim-site.yml'

permissions:
  contents: write

jobs:
  update-site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Advance site to March 2038
        run: |
          python - <<'PY'
          from pathlib import Path
          replacements = [
            ("const SIM_TODAY = new Date('2038-01-31T12:00:00');", "const SIM_TODAY = new Date('2038-03-31T12:00:00');"),
            ('As of January 2038, Dextair operates 94 revenue-active aircraft.', 'As of March 2038, Dextair operates 94 revenue-active aircraft.'),
            ('Cabin refresh underway: 13 aircraft completed with improved seats, refreshed finishes and updated lighting.', 'Cabin refresh complete across all 17 aircraft with improved seats, refreshed finishes and updated lighting.'),
            ('Cabin refresh underway: 7 aircraft completed with improved seats, refreshed finishes and updated lighting.', 'Cabin refresh complete across all 8 aircraft with improved seats, refreshed finishes and updated lighting.')
          ]
          for name in ['index.html','site-original.html']:
              p=Path(name)
              s=p.read_text()
              for old,new in replacements:
                  if old in s:
                      s=s.replace(old,new,1)
              p.write_text(s)
          PY
      - name: Commit March website update
        run: |
          git config user.name "Dextair Site Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html site-original.html
          git diff --cached --quiet || git commit -m "Advance Dextair website to March 2038"
          git push
