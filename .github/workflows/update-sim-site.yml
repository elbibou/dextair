name: Update Dextair simulation site

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-sim-site.yml'

permissions:
  contents: write

jobs:
  update-site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add four Midwest markets at five daily flights
        run: |
          python - <<'PY'
          from pathlib import Path

          new_airports = (
              ', {"code": "CLE", "city": "Cleveland", "country": "United States", "type": "mainline"}'
              ', {"code": "CMH", "city": "Columbus", "country": "United States", "type": "mainline"}'
              ', {"code": "IND", "city": "Indianapolis", "country": "United States", "type": "mainline"}'
              ', {"code": "CVG", "city": "Cincinnati", "country": "United States", "type": "mainline"}'
          )
          new_freqs = ', "CLE": 35, "CMH": 35, "IND": 35, "CVG": 35'
          new_plans = "\n  CLE:['Boeing 737-800','Airbus A320-200','Airbus A320neo','Boeing 737 MAX 8','Boeing 737-800'],\n  CMH:['Airbus A320-200','Boeing 737-800','Airbus A320neo','Boeing 737 MAX 8','Airbus A320-200'],\n  IND:['Boeing 737-800','Airbus A320neo','Airbus A320-200','Boeing 737 MAX 8','Boeing 737-800'],\n  CVG:['Airbus A320-200','Boeing 737-800','Boeing 737 MAX 8','Airbus A320neo','Boeing 737-800']\n"

          for name in ['index.html','site-original.html']:
              p = Path(name)
              s = p.read_text()

              if '"code": "CLE"' not in s:
                  marker = '];\nconst airportMap = Object.fromEntries(airports.map(a => [a.code, a]));'
                  if marker not in s:
                      raise SystemExit(f'airport marker missing in {name}')
                  s = s.replace(marker, new_airports + marker, 1)

              if '"CLE": 35' not in s:
                  marker = '};\nconst SIM_START = new Date('
                  if marker not in s:
                      raise SystemExit(f'route frequency marker missing in {name}')
                  s = s.replace(marker, new_freqs + marker, 1)

              start = s.index('const aircraftPlans = {')
              end = s.index('\n};', start)
              block = s[start:end]
              if 'CLE:[' not in block:
                  head = s[:end]
                  sep = '' if head.rstrip().endswith(',') else ','
                  s = head + sep + new_plans + s[end:]

              s = s.replace(
                  "['MCI','ORD','DTW','STL','PIT','IAH']",
                  "['MCI','ORD','DTW','STL','PIT','IAH','CLE','CMH','IND','CVG']",
                  1
              )

              p.write_text(s)
          PY
      - name: Commit new route launch
        run: |
          git config user.name "Dextair Site Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html site-original.html
          git diff --cached --quiet || git commit -m "Start CLE CMH IND and CVG five times daily"
          git push
