name: Update Dextair simulation site

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-sim-site.yml'

permissions:
  contents: write

jobs:
  update-site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Advance site to October 2037 and cabin rollout
        run: |
          python - <<'PY'
          from pathlib import Path
          for name in ['index.html','site-original.html']:
              p=Path(name)
              s=p.read_text()
              s=s.replace("const SIM_TODAY = new Date('2037-09-30T12:00:00');", "const SIM_TODAY = new Date('2037-10-31T12:00:00');", 1)
              s=s.replace('As of September 2037, Dextair operates 94 revenue-active aircraft.', 'As of October 2037, Dextair operates 94 revenue-active aircraft.', 1)
              s=s.replace('Flagship new cabin: extra-comfort seats, modern ambient lighting and a Florida beach-inspired interior blended with Dextair branding.', 'Flagship cabin rollout underway: extra-comfort seats, modern ambient lighting and a Florida beach-inspired interior blended with Dextair branding.', 1)
              s=s.replace('Flagship new cabin: extra-comfort seats, modern ambient lighting and a Florida beach-inspired interior blended with Dextair branding.', 'Flagship cabin rollout underway: extra-comfort seats, modern ambient lighting and a Florida beach-inspired interior blended with Dextair branding.', 1)
              s=s.replace('200 seats for high-demand flying. Eco+ is being upgraded with seatback entertainment.', '200 seats for high-demand flying. Eco+ seatback entertainment rollout is underway, with 3 of 6 aircraft completed.', 1)
              p.write_text(s)
          PY
      - name: Commit October website update
        run: |
          git config user.name "Dextair Site Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html site-original.html
          git diff --cached --quiet || git commit -m "Advance Dextair website to October 2037"
          git push
